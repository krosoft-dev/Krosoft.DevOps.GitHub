name: NPM Publish

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: "24"
      run-lint:
        description: Enable lint step
        type: boolean
        default: false
      run-type-check:
        description: Enable type-check step
        type: boolean
        default: false
      run-tests:
        description: Enable test step
        type: boolean
        default: true
      deploy-pages:
        description: Deploy a static build to GitHub Pages once the package is published
        type: boolean
        default: false
      pages-build-script:
        description: npm script building the site to deploy
        type: string
        default: 'storybook:build'
      pages-path:
        description: Directory produced by the pages build script
        type: string
        default: 'storybook-static'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm for OIDC
        run: echo "registry=https://registry.npmjs.org/" > $NPM_CONFIG_USERCONFIG

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint --if-present

      - name: Type-check
        if: ${{ inputs.run-type-check }}
        run: npm run type-check --if-present

      - name: Test
        if: ${{ inputs.run-tests }}
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          CURRENT=$(npm view $PKG_NAME version 2>/dev/null || echo "0.0.0")
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_VERSION=$MAJOR.$MINOR.$((PATCH + 1))
          npm version $NEW_VERSION --no-git-tag-version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Publish ${{ steps.version.outputs.version }}
        run: |
          unset NODE_AUTH_TOKEN
          npx --yes npm@11 publish --provenance --access public

  # Construire le site APRÈS le publish permet à celui-ci d'afficher la version qui
  # vient d'être mise en ligne : le numéro n'est connu qu'une fois le publish passé.
  pages:
    if: ${{ inputs.deploy-pages }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.pages-build-script }}
        run: npm run --if-present "$BUILD_SCRIPT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.pages-path }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
