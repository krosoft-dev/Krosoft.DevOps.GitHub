name: NPM Build

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: '24'
      build-script:
        description: npm script running the build
        type: string
        default: 'build'
      run-lint:
        description: Enable lint step
        type: boolean
        default: false
      run-type-check:
        description: Enable type-check step
        type: boolean
        default: false
      run-tests:
        description: Enable test step
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint --if-present

      - name: Type-check
        if: ${{ inputs.run-type-check }}
        run: npm run type-check --if-present

      - name: Build
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run --if-present "$BUILD_SCRIPT"

      - name: Test
        if: ${{ inputs.run-tests }}
        run: npm test --if-present
